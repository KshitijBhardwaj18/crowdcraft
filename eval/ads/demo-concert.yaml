briefText: |-
  Script for Northline Fest, a fictional indie music festival in Austin, running as an Instagram reel in the US, aimed at live-music fans 21-34 in US cities.

  [0:00] Close-up: a needle drops on a record. A warm, psychedelic bassline kicks in.
  VO: Remember when you found a band before everyone else did?
  [0:04] Sunset over Barton Springs. The crowd sways.
  VO: Three days. Forty bands you'll brag about next year. One cold Topo Chico in your hand.
  [0:10] Fast cuts: food trucks, vintage tees, a drummer mid-solo.
  VO: Northline Fest. Zilker Park, Austin. November 14-16.
  [0:14] On screen: Early-bird passes $149. Link in bio.
  VO: Get there before the algorithm does.
